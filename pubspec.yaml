name: pdf_pro_no_ad
description: Premium offline-first, ad-free Android PDF Reader, Manager, Scanner & Converter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdfrx: ^1.0.101
  pdf: ^3.11.1
  image: ^4.3.0
  camera: ^0.11.0+2
  file_picker: ^10.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  local_auth: ^2.3.0
  crypto: ^3.0.6
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  intl: any
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
