name: Build PDF Pro No Ad Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Generate, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Patch pdfrx
        run: |
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev/pdfrx-*/lib/src/pdfium -name "pdf_file_cache.dart" -exec sed -i 's/cache\.blockSize/cache!.blockSize/g; s/cache\.read(/cache!.read(/g' {} +

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-v1.0.0-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
