
name: Build PDF Pro No Ad Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Generate, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter setup
      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Python setup
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Check and prepare Android project
      - name: Prepare Android Project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create \
              --org com.comeback \
              --project-name pdf_pro_no_ad \
              --platforms=android .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper missing!"
            exit 1
          fi

          chmod +x android/gradlew

      # 6. Generate application source files
      - name: Generate PDF Pro No Ad Files
        run: |
          if [ ! -f generate_pdf_pro.py ]; then
            echo "ERROR: generate_pdf_pro.py not found!"
            exit 1
          fi

          python3 generate_pdf_pro.py

      # 7. Configure Flutter dependencies
      - name: Configure pubspec.yaml
        run: |
          cat > pubspec.yaml <<'EOF'
          name: pdf_pro_no_ad
          description: Premium offline-first, ad-free Android PDF Reader, Manager, Scanner and Converter.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            pdfrx: ^1.0.101
            pdf: ^3.11.1
            image: ^4.3.0
            camera: ^0.11.0+2
            file_picker: ^8.1.4
            path_provider: ^2.1.5
            path: ^1.9.0
            sqflite: ^2.4.1
            shared_preferences: ^2.3.3
            local_auth: ^2.3.0
            crypto: ^3.0.6
            share_plus: ^10.1.2
            permission_handler: ^11.3.1
            intl: any
            provider: ^6.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

          cat > analysis_options.yaml <<'EOF'
          analyzer:
            errors:
              deprecated_member_use: ignore
              deprecated_member_use_from_same_package: ignore
              use_build_context_synchronously: ignore
          EOF

      # 8. Fix FilePicker API calls
      - name: Fix FilePicker API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for f in Path("lib").rglob("*.dart"):
              text = f.read_text(encoding="utf-8")
              text = re.sub(
                  r"FilePicker\.(?!platform\.)(pickFiles|getDirectoryPath)",
                  r"FilePicker.platform.\1",
                  text
              )
              f.write_text(text, encoding="utf-8")
          PY

      # 9. Verify Android configuration
      - name: Verify Android Configuration
        run: |
          echo "Checking Android Gradle files..."

          find android -maxdepth 3 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \
            -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml missing!"
            exit 1
          fi

          if grep -q 'android.permission.INTERNET' \
            android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found!"
            exit 1
          fi

          echo "Android configuration check completed."

      # 10. Install Flutter packages
      - name: Install Flutter Dependencies
        run: |
          flutter clean
          flutter pub get

      # 11. Format source code
      - name: Format Dart Code
        run: |
          dart format lib

      # 12. Analyze source code
      - name: Run Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # 13. Run tests if test folder exists
      - name: Run Automated Tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found. Skipping tests."
          fi

      # 14. Build Android Release APK
      - name: Build Release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64

      # 15. Verify APK
      - name: Verify APK Output
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK not generated!"
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/PDF-Pro-No-Ad-v1.0.0.apk

          echo "APK successfully generated:"
          ls -lh release/

      # 16. Upload APK to GitHub
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-v1.0.0-Release
          path: release/PDF-Pro-No-Ad-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
          
      # 5. Check and prepare Android project
      - name: Prepare Android Project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create \
              --org com.comeback \
              --project-name pdf_pro_no_ad \
              --platforms=android .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper missing!"
            exit 1
          fi

          chmod +x android/gradlew

      # SECOND CODE GOES HERE
      - name: Remove Old Conflicting SDK Override
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              "android/settings.gradle",
              "android/settings.gradle.kts"
          ]:
              p = Path(name)
              if not p.exists():
                  continue

              text = p.read_text()
              marker = "gradle.beforeProject {"

              while marker in text:
                  start = text.find(marker)
                  depth = 0
                  end = -1

                  for i in range(start, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end < 0:
                      break

                  block = text[start:end]

                  if "compileSdk = 36" in block:
                      text = text[:start] + text[end:]
                      print("Removed old SDK override:", name)
                  else:
                      break

              p.write_text(text)
          PY

      # 6. Generate application source files
      - name: Generate PDF Pro No Ad Files
        run: |
          python3 generate_pdf_pro.py
          
