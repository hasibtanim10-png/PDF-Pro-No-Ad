name: Build PDF Pro No Ad Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Generate, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean & Setup Android Workspace
        run: |
          flutter create --org com.comeback --project-name pdf_pro_no_ad --platforms=android .
          rm -f android/app/build.gradle.kts

      - name: Write Clean Converter Screen & Configs
        run: |
          mkdir -p lib/screens

          cat << 'EOF' > lib/screens/converter_screen.dart
          import 'dart:io';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:path/path.dart' as p;
          import 'package:provider/provider.dart';
          import 'package:share_plus/share_plus.dart';
          import '../converters/pdf_converter_service.dart';
          import '../providers/app_provider.dart';

          enum ConverterMode { pdfToImage, imagesToPdf }

          class ConverterScreen extends StatefulWidget {
            final ConverterMode initialMode;
            final String? preselectedPdfPath;
            final OutputImageFormat initialFormat;

            const ConverterScreen({
              super.key,
              required this.initialMode,
              this.preselectedPdfPath,
              this.initialFormat = OutputImageFormat.jpg,
            });

            @override
            State<ConverterScreen> createState() => _ConverterScreenState();
          }

          class _ConverterScreenState extends State<ConverterScreen> {
            final PdfConverterService _converter = PdfConverterService();
            late ConverterMode _mode;
            late OutputImageFormat _format;
            ConversionQuality _quality = ConversionQuality.high;

            String? _selectedPdfPath;
            int _pdfTotalPages = 0;
            bool _convertAllPages = true;
            final TextEditingController _pageRangeCtrl = TextEditingController(text: '1');

            final List<String> _selectedImages = [];
            final TextEditingController _outPdfNameCtrl = TextEditingController(text: 'Merged_Images');

            String? _customOutputFolder;
            bool _isConverting = false;
            String _progressText = '';
            List<String> _generatedFiles = [];

            @override
            void initState() {
              super.initState();
              _mode = widget.initialMode;
              _format = widget.initialFormat;
              if (widget.preselectedPdfPath != null) {
                _loadPdf(widget.preselectedPdfPath!);
              }
            }

            Future<void> _loadPdf(String path) async {
              final count = await _converter.getPageCount(path);
              if (mounted) {
                setState(() {
                  _selectedPdfPath = path;
                  _pdfTotalPages = count;
                  _generatedFiles = [];
                });
              }
            }

            List<int> _parsePageSelection(String input, int maxPages) {
              final result = <int>{};
              for (final part in input.split(',')) {
                final trimmed = part.trim();
                if (trimmed.contains('-')) {
                  final bounds = trimmed.split('-');
                  if (bounds.length == 2) {
                    final start = int.tryParse(bounds[0].trim()) ?? 1;
                    final end = int.tryParse(bounds[1].trim()) ?? maxPages;
                    for (int i = start; i <= end; i++) {
                      if (i >= 1 && i <= maxPages) {
                        result.add(i);
                      }
                    }
                  }
                } else {
                  final single = int.tryParse(trimmed);
                  if (single != null && single >= 1 && single <= maxPages) {
                    result.add(single);
                  }
                }
              }
              return result.toList()..sort();
            }

            Future<void> _runConversion() async {
              setState(() {
                _isConverting = true;
                _generatedFiles = [];
              });
              try {
                if (_mode == ConverterMode.pdfToImage && _selectedPdfPath != null) {
                  final pages = _convertAllPages
                      ? null
                      : _parsePageSelection(_pageRangeCtrl.text, _pdfTotalPages);
                  final files = await _converter.convertPdfToImages(
                    pdfPath: _selectedPdfPath!,
                    format: _format,
                    pages: pages,
                    quality: _quality,
                    outputFolder: _customOutputFolder,
                    onProgress: (cur, tot) {
                      if (mounted) {
                        setState(() => _progressText = 'Rendering page $cur of $tot...');
                      }
                    },
                  );
                  if (mounted) setState(() => _generatedFiles = files);
                } else if (_mode == ConverterMode.imagesToPdf && _selectedImages.isNotEmpty) {
                  final provider = context.read<AppProvider>();
                  final outPdf = await _converter.convertImagesToPdf(
                    imagePaths: _selectedImages,
                    outputFileName: _outPdfNameCtrl.text,
                    quality: _quality,
                    outputFolder: _customOutputFolder,
                    onProgress: (cur, tot) {
                      if (mounted) {
                        setState(() => _progressText = 'Embedding image $cur of $tot...');
                      }
                    },
                  );
                  await provider.refreshAll();
                  if (mounted) setState(() => _generatedFiles = [outPdf]);
                }
              } finally {
                if (mounted) {
                  setState(() {
                    _isConverting = false;
                    _progressText = '';
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0A0A0A),
                  title: Text(_mode == ConverterMode.pdfToImage ? 'PDF to Image' : 'Images to PDF'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    SegmentedButton<ConverterMode>(
                      segments: const [
                        ButtonSegment(value: ConverterMode.pdfToImage, label: Text('PDF → JPG/PNG')),
                        ButtonSegment(value: ConverterMode.imagesToPdf, label: Text('Images → PDF')),
                      ],
                      selected: {_mode},
                      onSelectionChanged: (s) => setState(() {
                        _mode = s.first;
                        _generatedFiles = [];
                      }),
                    ),
                    const SizedBox(height: 16),
                    if (_mode == ConverterMode.pdfToImage) ...[
                      OutlinedButton.icon(
                        icon: const Icon(Icons.picture_as_pdf),
                        label: Text(
                          _selectedPdfPath == null
                              ? 'Select Source PDF'
                              : '${p.basename(_selectedPdfPath!)} ($_pdfTotalPages pages)',
                        ),
                        onPressed: () async {
                          final res = await FilePicker.platform.pickFiles(
                            type: FileType.custom,
                            allowedExtensions: ['pdf'],
                          );
                          if (res != null && res.files.single.path != null) {
                            await _loadPdf(res.files.single.path!);
                          }
                        },
                      ),
                      const SizedBox(height: 12),
                      SegmentedButton<OutputImageFormat>(
                        segments: const [
                          ButtonSegment(value: OutputImageFormat.jpg, label: Text('JPG')),
                          ButtonSegment(value: OutputImageFormat.png, label: Text('PNG')),
                        ],
                        selected: {_format},
                        onSelectionChanged: (s) => setState(() => _format = s.first),
                      ),
                      SwitchListTile(
                        title: const Text('Convert All Pages'),
                        value: _convertAllPages,
                        activeThumbColor: const Color(0xFFDC143C),
                        onChanged: (v) => setState(() => _convertAllPages = v),
                      ),
                      if (!_convertAllPages)
                        TextField(
                          controller: _pageRangeCtrl,
                          decoration: const InputDecoration(
                            labelText: 'Selected Pages (e.g. 1, 3-5)',
                            border: OutlineInputBorder(),
                          ),
                        ),
                    ] else ...[
                      OutlinedButton.icon(
                        icon: const Icon(Icons.add_photo_alternate),
                        label: Text('Select Images (${_selectedImages.length} selected)'),
                        onPressed: () async {
                          final res = await FilePicker.platform.pickFiles(
                            type: FileType.image,
                            allowMultiple: true,
                          );
                          if (res != null) {
                            setState(() {
                              _selectedImages.addAll(
                                res.files.where((f) => f.path != null).map((f) => f.path!),
                              );
                            });
                          }
                        },
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _outPdfNameCtrl,
                        decoration: const InputDecoration(
                          labelText: 'Output PDF Name',
                          border: OutlineInputBorder(),
                        ),
                      ),
                    ],
                    const SizedBox(height: 12),
                    DropdownButtonFormField<ConversionQuality>(
                      initialValue: _quality,
                      decoration: const InputDecoration(
                        labelText: 'Output Quality',
                        border: OutlineInputBorder(),
                      ),
                      items: ConversionQuality.values
                          .map((q) => DropdownMenuItem(value: q, child: Text(q.label)))
                          .toList(),
                      onChanged: (q) {
                        if (q != null) setState(() => _quality = q);
                      },
                    ),
                    const SizedBox(height: 12),
                    OutlinedButton.icon(
                      icon: const Icon(Icons.folder_open),
                      label: Text(
                        _customOutputFolder == null
                            ? 'Output Folder: Default (PDFProConverted)'
                            : 'Output: $_customOutputFolder',
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                      onPressed: () async {
                        final dir = await FilePicker.platform.getDirectoryPath();
                        if (dir != null) setState(() => _customOutputFolder = dir);
                      },
                    ),
                    const SizedBox(height: 18),
                    FilledButton.icon(
                      icon: const Icon(Icons.bolt),
                      label: Text(_isConverting ? _progressText : 'Start Conversion'),
                      onPressed: _isConverting ? null : _runConversion,
                    ),
                    if (_generatedFiles.isNotEmpty) ...[
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text(
                            'Converted Files (${_generatedFiles.length})',
                            style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                          ),
                          FilledButton.tonalIcon(
                            icon: const Icon(Icons.share),
                            label: const Text('Share All'),
                            onPressed: () => Share.shareXFiles(
                              _generatedFiles.map((path) => XFile(path)).toList(),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 10),
                      ..._generatedFiles.map(
                        (filePath) => Card(
                          color: const Color(0xFF121212),
                          child: ListTile(
                            leading: filePath.endsWith('.pdf')
                                ? const Icon(Icons.picture_as_pdf, color: Color(0xFFDC143C))
                                : Image.file(File(filePath), width: 44, height: 44, fit: BoxFit.cover),
                            title: Text(p.basename(filePath), maxLines: 1, overflow: TextOverflow.ellipsis),
                            trailing: IconButton(
                              icon: const Icon(Icons.share),
                              onPressed: () => Share.shareXFiles([XFile(filePath)]),
                            ),
                          ),
                        ),
                      ),
                    ],
                  ],
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > pubspec.yaml
          name: pdf_pro_no_ad
          description: Premium offline-first, ad-free Android PDF Reader, Manager, Scanner & Converter.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            pdfrx: ^1.0.101
            pdf: ^3.11.1
            image: ^4.3.0
            camera: ^0.11.0+2
            file_picker: ^8.1.4
            path_provider: ^2.1.5
            path: ^1.9.0
            sqflite: ^2.4.1
            shared_preferences: ^2.3.3
            local_auth: ^2.3.0
            crypto: ^3.0.6
            share_plus: ^10.1.2
            permission_handler: ^11.3.1
            intl: any
            provider: ^6.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > analysis_options.yaml
          analyzer:
            errors:
              deprecated_member_use: ignore
              deprecated_member_use_from_same_package: ignore
              use_build_context_synchronously: ignore
          EOF

          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          subprojects {
              project.plugins.withId("com.android.library") {
                  project.android {
                      compileSdk = 36
                  }
              }
              project.plugins.withId("com.android.application") {
                  project.android {
                      compileSdk = 36
                  }
              }
              tasks.configureEach { task ->
                  if (task.name.contains("AarMetadata") || task.name.contains("Lint")) {
                      task.enabled = false
                  }
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          printf "\nandroid.suppressUnsupportedCompileSdk=36\n" >> android/gradle.properties
          chmod +x android/gradlew

      - name: Commit Generated Source Files to Repository
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate PDF Pro No Ad project files [skip ci]"
            git push
          fi

      - name: Verify Package ID and Offline Manifest
        run: |
          grep -q 'com.comeback.pdfprona' android/app/build.gradle
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not be present."
            exit 1
          fi

      - name: Install Flutter Dependencies & Patch All Plugin SDKs
        run: |
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev/pdfrx-*/lib/src/pdfium -name "pdf_file_cache.dart" -exec sed -i 's/cache\.blockSize/cache!.blockSize/g; s/cache\.read(/cache!.read(/g' {} +
          python3 -c '
          from pathlib import Path
          import re
          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if pub_cache.exists():
              for gfile in list(pub_cache.rglob("build.gradle")) + list(pub_cache.rglob("build.gradle.kts")):
                  txt = gfile.read_text(encoding="utf-8")
                  txt = re.sub(r"compileSdkVersion\s+\d+", "compileSdk 36", txt)
                  txt = re.sub(r"compileSdk\s*=?\s*\d+", "compileSdk = 36", txt)
                  txt = re.sub(r"flutter\.compileSdkVersion", "36", txt)
                  gfile.write_text(txt, encoding="utf-8")
          '

      - name: Format Dart Code
        run: dart format lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Verify and Copy APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PDF-Pro-No-Ad-v1.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-v1.0.0-release-apk
  
