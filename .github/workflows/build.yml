name: Build PDF Pro No Ad Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Generate, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean & Setup Android Workspace
        run: |
          flutter create --org com.comeback --project-name pdf_pro_no_ad --platforms=android .
          rm -f android/app/build.gradle.kts

      - name: Generate & Sanitize All Project Files
        run: |
          python3 generate_pdf_pro.py

          cat << 'EOF' > pubspec.yaml
          name: pdf_pro_no_ad
          description: Premium offline-first, ad-free Android PDF Reader, Manager, Scanner & Converter.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            pdfrx: ^1.0.101
            pdf: ^3.11.1
            image: ^4.3.0
            camera: ^0.11.0+2
            file_picker: ^8.1.4
            path_provider: ^2.1.5
            path: ^1.9.0
            sqflite: ^2.4.1
            shared_preferences: ^2.3.3
            local_auth: ^2.3.0
            crypto: ^3.0.6
            share_plus: ^10.1.2
            permission_handler: ^11.3.1
            intl: any
            provider: ^6.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > analysis_options.yaml
          analyzer:
            errors:
              deprecated_member_use: ignore
              deprecated_member_use_from_same_package: ignore
              use_build_context_synchronously: ignore
          EOF

          python3 -c '
          from pathlib import Path
          import re
          for f in Path("lib").rglob("*.dart"):
              t = f.read_text(encoding="utf-8")
              t = re.sub(r"FilePicker\.(?!platform\.)(pickFiles|getDirectoryPath)", r"FilePicker.platform.\1", t)
              f.write_text(t, encoding="utf-8")
          '

          if [ -f "android/settings.gradle.kts" ]; then
            if ! grep -q "compileSdk = 36" android/settings.gradle.kts; then
              printf '\ngradle.beforeProject {\n    plugins.withId("com.android.library") {\n        extensions.configure<com.android.build.gradle.LibraryExtension> {\n            compileSdk = 36\n        }\n    }\n}\n' >> android/settings.gradle.kts
            fi
          elif [ -f "android/settings.gradle" ]; then
            if ! grep -q "compileSdk = 36" android/settings.gradle; then
              printf '\ngradle.beforeProject {\n    plugins.withId("com.android.library") {\n        android {\n            compileSdk = 36\n        }\n    }\n}\n' >> android/settings.gradle
            fi
          fi
          chmod +x android/gradlew

      - name: Verify Package ID and Offline Manifest
        run: |
          grep -q 'com.comeback.pdfprona' android/app/build.gradle
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not be present."
            exit 1
          fi

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev/pdfrx-*/lib/src/pdfium -name "pdf_file_cache.dart" -exec sed -i 's/cache\.blockSize/cache!.blockSize/g; s/cache\.read(/cache!.read(/g' {} +

      - name: Format Dart Code
        run: dart format lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Verify and Copy APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PDF-Pro-No-Ad-v1.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-v1.0.0-release-apk
          path: build/app/outputs/flutter-apk/PDF-Pro-No-Ad-v1.0.0.apk
          retention-days: 30
          
