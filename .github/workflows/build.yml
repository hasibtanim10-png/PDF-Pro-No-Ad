name: Build PDF Pro No Ad Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Format, Analyze, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap Android & Gradle Wrapper if missing
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create --org com.comeback --project-name pdf_pro_no_ad --platforms=android .
          fi

      - name: Generate Project Source & Config Files
        run: |
          if [ -f "generate_pdf_pro.py" ]; then
            sed -i 's/= """/= r"""/g' generate_pdf_pro.py
            python3 generate_pdf_pro.py
          fi
          rm -f android/app/build.gradle.kts
          sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle
          sed -i 's/targetSdk = 34/targetSdk = 35/' android/app/build.gradle
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"|android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:replace="android:maxSdkVersion"|' android/app/src/main/AndroidManifest.xml
          sed -i 's/intl: \^0.19.0/intl: any/' pubspec.yaml
          sed -i "1i import 'dart:ui';" lib/services/pdf_converter_service.dart
          sed -i "s|import 'package:pdf/pdf.dart';|import 'package:pdf/pdf.dart' hide PdfDocument;|" lib/services/pdf_converter_service.dart
          sed -i 's/backgroundColor: 0xFFFFFFFF/backgroundColor: Color(0xFFFFFFFF)/g' lib/services/pdf_converter_service.dart
          chmod +x android/gradlew

      - name: Verify Package ID and Offline Manifest
        run: |
          grep -q 'com.comeback.pdfprona' android/app/build.gradle
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not be present."
            exit 1
          fi

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev/pdfrx-*/lib/src/pdfium -name "pdf_file_cache.dart" -exec sed -i 's/cache\.blockSize/cache!.blockSize/g; s/cache\.read(/cache!.read(/g' {} +

      - name: Format Dart Code
        run: dart format lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Verify APK Output
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PDF-Pro-No-Ad-v1.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-v1.0.0-release-apk
          path: build/app/outputs/flutter-apk/PDF-Pro-No-Ad-v1.0.0.apk
          retention-days: 30
          
